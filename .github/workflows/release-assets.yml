name: build-and-release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'  # 使用 Node.js 22 版本

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来创建发布并上传附件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: npm ci

      - name: Run packageJS script
        run: npm run packageJS

      - name: Run packageJS-green script
        run: npm run packageJS-green

      - name: Collect generated 7z files
        run: |
          # packageJS / packageJS-green 把压缩包生成在仓库的上级目录
          mkdir -p release-artifacts
          found=0
          for f in ../*.7z; do
            [ -e "$f" ] || continue
            cp "$f" release-artifacts/
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 7z 产物，打包脚本可能失败"
            exit 1
          fi
          echo "Collected files:"
          ls -lh release-artifacts/

      - name: Create or update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          # 覆盖同名附件，便于失败后重跑；匹配不到产物直接失败，避免假成功
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.7z

      - name: Verify upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json tagName,assets \
            --jq '"\(.tagName): \(.assets | length) asset(s)", (.assets[] | "  - \(.name) \(.size) bytes")'
